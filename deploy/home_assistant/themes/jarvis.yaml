# Jarvis panel themes — one sky per part of the day.
#
# Home Assistant switches these system-wide with frontend.set_theme, driven by
# an automation on the sun and the weather. They carry the palette and the
# translucency; nothing here changes what any card does.
#
# Two spellings of the same idea appear on purpose: `lovelace-background` and
# `primary-background-color` for the view behind everything, `ha-card-background`
# and `card-background-color` for the cards. Home Assistant has used both over
# time and an unknown variable is simply ignored, so setting both is how this
# stays working across frontend versions instead of guessing which one is live.
#
# Cards are deliberately translucent so the sky reads through them. That is the
# whole point — an opaque card on a gradient looks like a sticker on a window.

jarvis_dan:
  # --- brand ---
  primary-color: "#b06a1e"
  accent-color: "#b06a1e"
  dark-primary-color: "#8a5216"
  light-primary-color: "#d38c3e"
  # --- text ---
  primary-text-color: "#14181d"
  secondary-text-color: "#4a5560"
  disabled-text-color: "#8a949e"
  text-primary-color: "#ffffff"
  # --- the sky ---
  primary-background-color: "#cfdfea"
  secondary-background-color: "#e9eef0"
  lovelace-background: "linear-gradient(170deg, #a9c9e4 0%, #cfdfea 42%, #e9eef0 100%) fixed"
  # --- cards float on it ---
  ha-card-background: "rgba(255, 255, 255, 0.58)"
  card-background-color: "rgba(255, 255, 255, 0.58)"
  ha-card-border-color: "rgba(20, 24, 29, 0.14)"
  ha-card-border-width: "1px"
  ha-card-border-radius: "10px"
  ha-card-box-shadow: "none"
  divider-color: "rgba(20, 24, 29, 0.12)"
  # --- chrome ---
  app-header-background-color: "transparent"
  app-header-text-color: "#14181d"
  sidebar-background-color: "rgba(255, 255, 255, 0.72)"
  sidebar-text-color: "#14181d"
  sidebar-icon-color: "#4a5560"
  sidebar-selected-icon-color: "#b06a1e"
  sidebar-selected-text-color: "#b06a1e"
  # --- state ---
  state-icon-color: "#4a5560"
  state-icon-active-color: "#b06a1e"
  paper-item-icon-color: "#4a5560"
  paper-item-icon-active-color: "#b06a1e"
  switch-checked-color: "#b06a1e"

